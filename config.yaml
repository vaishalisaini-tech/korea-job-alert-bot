# ---------------- SKILLS (semantic / skill-based matching) ------------
skills:
  highest: [python, kubernetes, docker, linux, cloud, terraform, ci/cd, infrastructure automation, sre, platform engineering]
  high: [gcp, aws, azure, jenkins, gitlab ci, prometheus, grafana, alertmanager, helm, argocd, gitops, ansible, observability, microservices, rest api, fastapi, django, postgresql, mysql, pytest]
  additional: [network automation, cisco, huawei, nokia, juniper, ssh, netmiko, network infrastructure, configuration management]
  ai: [ai infrastructure, mlops, llm, rag, agentic, automated remediation, anomaly detection, model serving]

  # Skills the JD may want that you do NOT have yet -> shown as "gaps",
  # and counted at half weight (related experience).
  not_have: [aws, azure, helm, argocd, gitops, ansible, netmiko, mlops]

  # Skills that decide whether a Backend-titled job is really relevant
  backend: [python, fastapi, django, rest api, microservices, postgresql, mysql, docker, kubernetes, linux, cloud, ci/cd, distributed systems, asynchronous]

  # Alternate spellings / Korean terms
