    platform engineering: [platform engineer, internal developer platform, 플랫폼 엔지니어링]
    rest api: [restful, rest apis]
    postgresql: [postgres]
    prometheus: [프로메테우스]
    grafana: [그라파나]
    observability: [monitoring, opentelemetry, 모니터링]
    gitlab ci: [gitlab]
    ssh: [ssh automation]
    configuration management: [puppet, chef, ansible]
