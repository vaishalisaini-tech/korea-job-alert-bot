# ---------------- SCORING & PRIORITY ---------------------------------
scoring:
  weights: {highest: 5, high: 3, additional: 2, ai: 2}
  cap: 40                 # weighted skill points that equal 100% skill match
  skill_only_min: 40      # min score for a job matched by skills (title not in a family)
  skill_only_min_highest: 4   # ...and at least this many "highest" skills
  min_skill_matches: 2    # any job must mention >= 2 of your skills (when a description exists)
  backend_min_skills: 3   # Backend titles need >= 3 of skills.backend (incl. python or kubernetes)
  strong: 65              # "strong technical match"
  good: 50
  reasonable: 35

# ---------------- EXPERIENCE (yours: 5 years) ------------------------
experience:
  mine: 5
  min_accept_years: 2     # skip jobs asking for LESS than this
  max_accept_years: 6     # skip jobs asking for MORE than this (7+, 10+ yrs are removed)
  leadership_title_words: [lead, principal, manager, director, head of, vp, staff, 리드, 팀장, 매니저]
  leadership_penalty: -6
  junior_title_words: [intern, internship, graduate, fresh, new grad, entry level, junior, 인턴, 신입]

# ---------------- FRESHNESS (only recent jobs are alerted) -----------
freshness:
  max_age_days: 10        # jobs older than this are NEVER alerted
  today_hours: 48         # up to 2 days  -> "APPLY TODAY" window
  review_hours: 120       # up to 5 days  -> "REVIEW" window (5-10 days = BACKUP)
  include_unknown_date_on_first_run: false   # jobs with no posting date are skipped on the very first run

# ---------------- LANGUAGE / VISA RULES ------------------------------
language:
  exclude_if_korean_mandatory: true   # only when Korean fluency is explicitly mandatory
visa:
  exclude_if_unavailable: true        # explicit "no visa sponsorship" / foreigners cannot apply

# ---------------- NOTIFICATIONS --------------------------------------
notify:
  # which priorities to send (remove "backup" if you only want the best)
  send_priorities: [immediate, today, review, backup]
max_first_run_alerts: 30

